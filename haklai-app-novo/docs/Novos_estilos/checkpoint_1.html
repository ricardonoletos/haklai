<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Presence Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script>

                    colors: {
                        primary: "#2563EB", // A nice, modern blue

                        "text-dark": "#E4E4E7",
                        "text-muted-light": "#71717A",
                        "text-muted-dark": "#A1A1AA"
                    },
                    fontFamily: {
                        display: ["Poppins", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem", // Using 1rem for a softer, more modern look
                    },
                },
            },
        };
    </script>
<style>

            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24

    </style>
<style>
    body {

<style>

</div>
</div>
<div class="p-4 pt-0">
<header class="flex items-center justify-between py-6 px-2">
<div>
<h1 class="text-2xl font-bold text-text-light dark:text-text-dark">Dashboard de Presença</h1>
<p class="text-sm text-text-muted-light dark:text-text-muted-dark">Resumo de atividade</p>
</div>
<div class="relative">

<div>
<p class="text-sm uppercase opacity-80 tracking-wider">Taxa de Presença</p>
<p class="text-4xl font-bold mt-1">87%</p>
</div>
<div class="bg-white/20 p-3 rounded-full">
<span class="material-symbols-outlined text-4xl text-white">

</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-card-light dark:bg-card-dark p-4 rounded-DEFAULT shadow-md flex flex-col items-start justify-between">
<div class="bg-blue-100 dark:bg-blue-900/50 p-3 rounded-lg">
<span class="material-symbols-outlined text-primary">

<div class="mt-4">
<p class="text-3xl font-bold text-text-light dark:text-text-dark">9</p>

<div class="bg-card-light dark:bg-card-dark p-4 rounded-DEFAULT shadow-md flex flex-col items-start justify-between">

<span class="material-symbols-outlined text-orange-500">

                        </span>
</div>

</div>
</div>
<p class="text-2xl font-bold text-text-light dark:text-text-dark">8</p>
</div>

</div>
</div>

</div>
<span class="text-xs font-medium mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center p-2 text-text-muted-light dark:text-text-muted-dark">
<span class="material-symbols-outlined">group</span>
<span class="text-xs font-medium mt-1">Membros</span>
</button>
<button class="flex flex-col items-center p-2 text-text-muted-light dark:text-text-muted-dark">
<span class="material-symbols-outlined">add_circle</span>
<span class="text-xs font-medium mt-1">Adicionar</span>
</button>
<button class="flex flex-col items-center p-2 text-text-muted-light dark:text-text-muted-dark">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-xs font-medium mt-1">Relatórios</span>
</button>
<button class="flex flex-col items-center p-2 text-text-muted-light dark:text-text-muted-dark">

</button>
</div>
</footer>
